name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff
      - run: ruff check --select E4,E7,E9,F .
      - run: python -m unittest discover -s tests -v
      - run: docker build --build-arg YTDLP_VERSION=2026.10.26 -t railway-video-bot .
